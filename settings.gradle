pluginManagement {
    repositories {
        // 优先使用阿里云镜像下载 Gradle 插件
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }

        // 官方备用源
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // 保持你原有的工具链解析插件
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    // 强制所有模块使用这里的仓库配置
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Firebase 必须从官方 Google Maven 获取。
        // 部分镜像会先同步 BoM/POM，却暂时缺少对应 AAR；Gradle 一旦从该镜像
        // 选定模块元数据，就不会再去后面的仓库补找缺失的 AAR。
        exclusiveContent {
            forRepository {
                maven {
                    name = 'GoogleFirebaseOfficial'
                    url = uri('https://dl.google.com/dl/android/maven2/')
                }
            }
            filter {
                includeGroup('com.google.firebase')
            }
        }

        // 其他 Android/Google 与第三方依赖仍优先使用阿里云镜像。
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }

        // 官方备用源
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' } // 很多开源库需要的 JitPack 仓库
    }
}

// 替换为你的项目名称
rootProject.name = "MyPDF"
include ':app'
